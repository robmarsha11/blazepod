<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BlazePod Drill Launcher</title>
<style>
body{font-family:system-ui,sans-serif;background:#111;color:#f4f4f4;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;margin:0;padding:1.5rem}
h1{margin-bottom:.3rem;font-size:2rem}

.title{font-size:1.2rem;font-weight:700;margin-bottom:.3rem;color:#38bdf8}
.desc{font-size:.9rem;color:#d1d5db}

<p>Select a drill to pair your pods and begin</p>
<div class="menu">
  <a class="card" href="battle.html">
    <div class="title">Game 1. 2-Player Red vs. Blue</div>
    <div class="desc">Head-to-head Fastest Feet • Highest score wins</div>
  </a>
  <a class="card" href="milestone.html">
    <div class="title">Game 2. 2-Player Home-Base Milestone</div>
    <div class="desc">First to every 10 points turns all pods their color. Run to that base</div>
  </a>
</div>
